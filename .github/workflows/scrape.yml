name: Scrape Properties

# Corre en un self-hosted runner (Mac o Windows): RE/MAX bloquea (403)
# las IPs de datacenter de los runners hospedados por GitHub.
# Requisitos de la PC: Python 3 y Google Chrome instalados. Ver RUNNER.md.

on:
  schedule:
    - cron: '0 12 * * *'  # Todos los días a las 12:00 UTC (9 AM Buenos Aires)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 20

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies y run scraper (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # launchd arranca con un PATH mínimo: sumar Homebrew y las rutas habituales
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          python3 -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip
          .venv/bin/python -m pip install -q -r requirements.txt
          .venv/bin/python actionscraping.py

      - name: Install dependencies y run scraper (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el entorno virtual" }
          .venv\Scripts\python.exe -m pip install -q --upgrade pip
          .venv\Scripts\python.exe -m pip install -q -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install falló" }
          .venv\Scripts\python.exe actionscraping.py
          if ($LASTEXITCODE -ne 0) { throw "El scraper falló" }

      - name: Subir diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-error
          path: |
            scrape_error.png
            scrape_error.html
          if-no-files-found: ignore

      # Los comandos git son iguales en bash y PowerShell; solo cambia el chequeo de errores.
      - name: Commit cambios si los hay (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/propiedades.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🔄 Auto-update propiedades.json"
          # Sincronizar con main remoto para evitar rechazo non-fast-forward
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit cambios si los hay (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/propiedades.json
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
            exit 0
          }
          git commit -m "🔄 Auto-update propiedades.json"
          if ($LASTEXITCODE -ne 0) { throw "git commit falló" }
          # Sincronizar con main remoto para evitar rechazo non-fast-forward
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw "git pull falló" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "git push falló" }
